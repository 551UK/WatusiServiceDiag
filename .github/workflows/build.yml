name: Build WatusiServiceDiag

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos
        uses: beerpiss/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks

      - name: Install Debian packaging tools
        run: brew install dpkg

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^Package: com.551.watusiservicediag$' control
          grep -q '^Version: 1.0.0$' control
          grep -q 'MEMORYSTATUS_CMD_GET_MEMLIMIT_PROPERTIES' Tweak.x
          grep -q 'proc_pid_rusage' Tweak.x
          grep -q 'objc_exception_throw' Tweak.x
          grep -q 'ServiceExtension' Tweak.x
          chmod +x layout/usr/bin/watusidiag-collect
          test -x layout/usr/bin/watusidiag-collect

      - name: Build rootless DEB
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .theos packages
          THEOS_PACKAGE_SCHEME=rootless make clean
          THEOS_PACKAGE_SCHEME=rootless \
          THEOS_PLATFORM_DEB_COMPRESSION_TYPE=gzip \
          THEOS_PLATFORM_DEB_COMPRESSION_LEVEL=6 \
          make package FINALPACKAGE=1 \
          _THEOS_PLATFORM_DPKG_DEB="$(command -v dpkg-deb)"

          DEB=$(find packages -type f -name '*.deb' | head -n 1)
          test -n "$DEB"
          dpkg-deb --info "$DEB"
          test "$(dpkg-deb -f "$DEB" Architecture)" = 'iphoneos-arm64'
          test "$(dpkg-deb -f "$DEB" Package)" = 'com.551.watusiservicediag'

      - name: Upload compiled DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: WatusiServiceDiag-rootless-DEB
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(awk '/^Version:/ {print $2}' control)
          TAG="v${VERSION}"
          DEB=$(find packages -type f -name '*.deb' | head -n 1)
          test -n "$DEB"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" \
              --target "${GITHUB_SHA}" \
              --title "WatusiServiceDiag ${VERSION}" \
              --notes "Diagnostic-only rootless Dopamine tweak for investigating WhatsApp/Watusi ServiceExtension crashes. Records effective Jetsam limits, memory footprint, process disappearance, Objective-C exceptions, and common termination paths. Does not change memory limits."
          fi
